<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Open-mind — Trợ lý Học tập AI Toàn diện, 100% Offline. Phân tích bài giảng, Flashcard SM-2, Quiz AI, RAG Q&A." />
  <title>Open-mind · AI Learning Companion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ══════════════════════════════════════════
     SPLASH SCREEN
══════════════════════════════════════════ -->
<div id="splash">
  <!-- Mesh gradient background dots -->
  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
    <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.08),transparent);top:-200px;left:-150px;"></div>
    <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.06),transparent);bottom:-150px;right:-100px;"></div>
  </div>

  <div class="splash-card">
    <div class="splash-logo">
      <img src="logo.jpg" alt="Open-mind" />
    </div>
    <h1 class="splash-title">Open-mind</h1>
    <p class="splash-sub">AI Learning Companion · 100% Offline & Private</p>

    <div class="splash-phases">
      <div class="phase-pill" id="phase1">① Mô hình giọng nói</div>
      <div class="phase-pill muted" id="phase2">② Mô hình ngôn ngữ</div>
    </div>

    <div class="splash-bar-wrap">
      <div class="splash-bar" id="splashBar" style="width:5%"></div>
    </div>
    <p class="splash-status" id="splashStatus">Đang khởi động…</p>
    <p class="splash-hint" id="splashHint">Không cần kết nối Internet · Dữ liệu bảo mật tuyệt đối</p>
    <button class="btn btn-ghost btn-sm hidden" id="splashSkipBtn" style="margin-top:16px;font-size:12px;">
      Tiếp tục vào ứng dụng →
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════
     MAIN APP
══════════════════════════════════════════ -->
<div id="app" class="hidden">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-left">
      <div class="logo-icon-wrap">
        <img src="logo.jpg" alt="Open-mind" />
      </div>
      <span class="logo-text">Open-mind</span>
    </div>
    <div class="topbar-right">
      <div class="stat-pill pill-due" id="topDue">
        <i data-lucide="layers" style="width:13px;height:13px;"></i>
        <span>— thẻ cần ôn</span>
      </div>
      <div class="stat-pill pill-streak" id="topStreak">
        <i data-lucide="flame" class="flame-icon" style="width:13px;height:13px;"></i>
        <span>— ngày streak</span>
      </div>
    </div>
  </header>

  <!-- BODY -->
  <div class="app-body">

    <!-- SIDEBAR -->
    <nav id="sidebar">
      <div class="nav-group">
        <div class="nav-group-label">Học tập</div>

        <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          <span class="nav-label">Tổng quan</span>
        </button>

        <button class="nav-item" data-view="flashcard" id="nav-flashcard">
          <i data-lucide="layers" class="nav-icon"></i>
          <span class="nav-label">Thẻ ghi nhớ</span>
          <span class="nav-badge" id="sidebarDueBadge" style="display:none">0</span>
        </button>

        <button class="nav-item" data-view="lecture" id="nav-lecture">
          <i data-lucide="mic" class="nav-icon"></i>
          <span class="nav-label">Studio Bài giảng</span>
        </button>

        <button class="nav-item" data-view="library" id="nav-library">
          <i data-lucide="book-open" class="nav-icon"></i>
          <span class="nav-label">Thư viện</span>
        </button>

        <div class="nav-group-label">Phân tích</div>

        <button class="nav-item" data-view="stats" id="nav-stats">
          <i data-lucide="trending-up" class="nav-icon"></i>
          <span class="nav-label">Tiến độ & Streak</span>
        </button>

        <button class="nav-item" data-view="settings" id="nav-settings">
          <i data-lucide="settings" class="nav-icon"></i>
          <span class="nav-label">Cài đặt</span>
        </button>
      </div>

      <!-- Footer user profile -->
      <div class="sidebar-footer">
        <div class="footer-user">
          <div class="avatar-wrap">
            <img src="logo.jpg" alt="avatar" />
          </div>
          <div>
            <div class="avatar-name">Học viên</div>
            <div class="avatar-sub" id="sidebarXpLabel">Cấp độ 1 · 0 XP</div>
          </div>
        </div>
        <div class="xp-bar-wrap">
          <div class="xp-bar" id="sidebarXpBar" style="width:5%"></div>
        </div>
        <div class="flex justify-between">
          <span class="xp-label" id="sidebarXpText">0 / 100 XP</span>
          <span class="xp-label" style="display:inline-flex;align-items:center;gap:3px;"><i data-lucide="shield-check" style="width:11px;height:11px;color:var(--success);"></i> Offline</span>
        </div>
      </div>
    </nav>

    <!-- VIEWS -->
    <main id="content">
      <div id="view-dashboard" class="view"></div>
      <div id="view-flashcard" class="view hidden"></div>
      <div id="view-lecture"   class="view hidden"></div>
      <div id="view-library"   class="view hidden"></div>
      <div id="view-stats"     class="view hidden"></div>
      <div id="view-settings"  class="view hidden"></div>
    </main>
  </div>
</div>

<!-- Toast notification -->
<div id="toast" class="toast hidden"></div>

<!-- Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div id="modalBox" class="modal-box"></div>
</div>

<!-- SVG defs for ring gradient -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>

<!-- JS -->
<script src="js/lucide.min.js"></script>
<script src="js/app.js"></script>
<script src="js/flashcard.js"></script>
<script src="js/lecture.js"></script>
<script src="js/library.js"></script>
<script src="js/stats.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
